# The one PR check not yet covered by rbs: the renderer registry must match the vendored
# visualization-type manifest. The checker is dependency-free Node, so no install step.
# Moves into `rbs unit-test` once the repo has a unit tier; delete this file then.
name: visualization coverage

on:
  pull_request:
    branches:
      - ReduxAPI_GUI

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Check visualization type coverage
        run: node Tools/check-visualization-coverage.mjs
